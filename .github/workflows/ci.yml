name: ci-smoke
on: [push, pull_request]
jobs:
  c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - name: build
        run: cmake --build build
      - name: test
        run: ctest --test-dir build --output-on-failure
      # Injector-exclusion scan (audit F4; makes the B-02/B-13.1/qc_rng.h
      # "scan enforces" claims real). Test-injector SYMBOLS must never
      # appear in production sources — filename mentions in comments
      # (e.g. qc_rng.h documenting the rule) are fine, hence symbols not
      # basenames. The two injector TUs themselves live in crypto/ (test
      # builds only) and are excluded here; new test TUs must stay out of
      # prod dirs or be added below. sim/ out of scope by design
      # (SIM-only stubs live there).
      - name: injector-exclusion scan
        run: |
          ! grep -rn --include='*.c' --include='*.h' --exclude='test_rng.c' --exclude='test_entropy.c' -e 'test_rng_seed' -e 'test_entropy_seed' -e 'test_entropy_fail' -e 'qc_sim_seed' crypto/ core/ server/ gateway/
      # Floor-bypass exclusion (B-31.5): S0/S1/S4-style floor bypass must
      # never exist in firmware sources. Pattern targets floor-adjacent
      # bypass concepts only — the spec-mandated QC_BATCH_C2_BYPASS
      # mechanism is intentionally out of scope (verified clean 2026-10).
      # tests/ + sim/ excluded (experiment-config bypass lives there).
      - name: floor-bypass exclusion scan
        run: |
          ! grep -rni --include='*.c' --include='*.h' -e 'floor[_ ]*bypass' -e 'bypass[_ ]*floor' crypto/ core/ server/ gateway/
      # Sim determinism scan (B-43.1): wall-clock reads, threads, and
      # unseeded random must never enter sim/qcsim (banned by
      # construction); os.urandom lives only in the RNGStreams seeder.
      - name: sim banned-call scan
        run: |
          ! grep -rn --include='*.py' -e 'import time' -e 'from time import' -e 'import datetime' -e 'import threading' -e 'import random' sim/qcsim/
          test $(grep -rn --include='*.py' -e 'os.urandom(' sim/qcsim/ | wc -l) -eq 1
      # E1 producer/consumer contract (B-51.5). c_e1_smoke proves the
      # benchmark runs, but ctest discards its stdout - so nothing checked
      # that the rows it emits satisfy the DRIVER's schema. Producer and
      # consumer were authored together, so nothing outside that author had
      # verified they agree, and the stack-metric key was renamed twice in
      # the same chunk. This runs the real binary through the real parser.
      - name: E1 producer/consumer contract check
        run: python3 tools/e1_smoke_check.py
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install test deps
        run: python -m pip install pytest pytest-asyncio cryptography
      # The servant bridge tests need build/server/srv_crypto (targeted
      # build only — not the world — so this job stays fast; the C job
      # still owns the full build). Tests FAIL without it, never skip.
      - name: build crypto servant
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          cmake --build build --target srv_crypto -j2
      - name: test
        run: python -m pytest tests/python -q
      # Mutation adequacy (the anti-flimsiness gate). A green suite proves
      # the code passes the tests; it does NOT prove the tests would notice
      # if the code stopped honouring a guarantee. Three separate defects on
      # this chunk (per-row provenance never emitted, `status="fail"` read as
      # not-executed, a <skipped/> child counted as executed) each left the
      # whole suite GREEN. So each guarantee now has a planted single-line
      # wrongness, and a SURVIVOR fails this job: a named guarantee with no
      # test that can fail for it is not a guarantee. Runs here (not the
      # c job) because it drives pytest and needs no cmake.
      - name: mutation adequacy
        run: python tools/mutate_check.py
  # E0 correctness gate (plan B-50.4). Required status: a red gate blocks
  # every E-campaign, sim campaign, target measurement and protocol
  # integration. No waiver mechanism exists by design — there is no
  # continue-on-error and no force-green flag on this job (B-50.5 proves
  # that by code search in tests/python/test_e0_gate.py).
  # Needs the c job: the gate enumerates and runs the gated CTests.
  e0-gate:
    runs-on: ubuntu-latest
    needs: c
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The gate contract lives in sim/qcsim/gate.py and is imported through
      # the package, whose __init__ eagerly pulls in device.py (AESGCM).
      # cryptography is therefore required here too - NOT optional: a
      # correctness gate must fail loudly on a missing dependency, never
      # silently fall back to a second copy of its own ID logic.
      - name: install gate deps
        run: python -m pip install cryptography
      - name: configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - name: build
        run: cmake --build build
      - name: run E0 gate
        run: python tools/e0_gate.py
      # Minted record uploaded as an artifact: B-50.4 requires gate records
      # retained for the project lifetime, and B-51/B-52 record the gate ID
      # of their exact build.
      - name: upload gate record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e0-gate-record
          path: build/e0/
